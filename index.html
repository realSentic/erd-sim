<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ERD Simulator</title>
  <link rel="stylesheet" href="./dist/output.css" />
</head>
<body class="h-screen overflow-hidden bg-slate-950 font-sans text-slate-100 antialiased">
  <div class="h-full">
    <main class="relative h-full">
      <header class="pointer-events-none absolute left-4 top-4 z-10 flex flex-col gap-2">
        <div class="pointer-events-auto rounded-xl border border-slate-800 bg-slate-900/90 px-4 py-3 backdrop-blur">
          <h1 class="text-sm font-semibold tracking-wide">Electronics Store ERD</h1>
          <p class="text-xs text-slate-400">Drag tables · click one to trace its relationships</p>
        </div>
        <div id="legend" class="pointer-events-auto flex flex-wrap gap-2"></div>
      </header>

      <div id="viewport" class="grid-bg h-full overflow-auto">
        <div id="sizer" class="relative">
          <div id="canvas" class="absolute left-0 top-0 origin-top-left transition-transform duration-500" style="width:1260px;height:1080px">
            <svg id="edges" class="pointer-events-none absolute inset-0" width="1260" height="1080">
              <g id="paths"></g><g id="labels"></g><g id="packets"></g>
            </svg>
            <div id="cards"></div>
          </div>
        </div>
      </div>

      <div class="absolute bottom-4 left-4 z-10 flex items-center gap-1 rounded-xl border border-slate-700/70 bg-slate-900/90 p-1 text-xs backdrop-blur">
        <button id="zout" class="size-8 rounded-lg text-base hover:bg-slate-800" title="Zoom out">−</button>
        <span id="zlabel" class="w-12 text-center font-mono text-slate-400">100%</span>
        <button id="zin" class="size-8 rounded-lg text-base hover:bg-slate-800" title="Zoom in">+</button>
        <button id="zfit" class="rounded-lg px-3 py-2 hover:bg-slate-800" title="Fit whole ERD to screen">Fit</button>
        <button id="efs" class="rounded-lg bg-cyan-500 px-3 py-2 font-semibold text-slate-950 hover:bg-cyan-400">ERD fullscreen</button>
      </div>

      <aside id="panel" class="absolute right-4 top-4 z-20 flex max-h-[calc(100%-2rem)] w-[calc(100%-2rem)] max-w-sm flex-col overflow-hidden rounded-2xl border border-slate-700/70 bg-slate-900/90 shadow-2xl shadow-black/60 backdrop-blur-md">
        <div class="flex items-center gap-1 border-b border-slate-800 px-2 py-2">
          <button id="tab-sim" class="rounded-lg px-3 py-1.5 text-xs font-semibold">Simulation</button>
          <button id="tab-insp" class="rounded-lg px-3 py-1.5 text-xs font-semibold">Inspector</button>
          <span class="flex-1"></span>
          <button id="fs" title="Toggle fullscreen" class="rounded-lg px-2.5 py-1.5 text-xs text-slate-300 hover:bg-slate-800">Fullscreen</button>
          <button id="min" title="Collapse panel" class="rounded-lg px-2.5 py-1.5 text-xs text-slate-300 hover:bg-slate-800">Hide</button>
        </div>
        <div id="panelBody" class="overflow-y-auto p-4">
          <section id="sec-sim">
            <div id="scen" class="mb-3 flex flex-wrap gap-2"></div>
            <div id="dots" class="mb-3 flex gap-1"></div>
            <div id="step" class="mb-3 rounded-xl border border-slate-800 bg-slate-950/80 p-4 text-sm text-slate-300"></div>
            <div class="flex gap-2">
              <button id="prev" class="rounded-lg bg-slate-800 px-3 py-2 text-sm hover:bg-slate-700 disabled:opacity-30">Back</button>
              <button id="next" class="flex-1 rounded-lg bg-cyan-500 px-3 py-2 text-sm font-semibold text-slate-950 hover:bg-cyan-400"></button>
              <button id="reset" class="rounded-lg bg-slate-800 px-3 py-2 text-sm hover:bg-slate-700">Reset</button>
            </div>
            <p class="mt-2 text-center text-[11px] text-slate-500">Space = next step · Shift+Space or ← = back</p>
          </section>
          <section id="sec-insp" class="hidden"><div id="insp" class="text-sm text-slate-300"></div></section>
        </div>
      </aside>
    </main>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
